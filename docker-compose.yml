services:
  ollama:
    container_name: ${OLLAMA_CONTAINER_NAME:-base-ollama-container}
    image: ollama/ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  codex:
    container_name: ${CODEX_CONTAINER_NAME:?Set CODEX_CONTAINER_NAME in .env}
    build:
      context: .
      dockerfile: Dockerfile.codex
    image: local/codex-cli
    stdin_open: true
    tty: true
    working_dir: /workspace
    # Codex binds its OAuth server to container loopback. Relay it through
    # port 1456 so the host browser can reach the callback on localhost:1455.
    command: ["sh", "-c", "socat TCP-LISTEN:1456,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:1455 & exec sleep infinity"]
    ports:
      - "127.0.0.1:1455:1456"
    environment:
      HOME: /home/agent
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./workspace:/workspace
      - codex_home:/home/agent/.codex
    init: true
    restart: unless-stopped

  antigravity:
    container_name: ${ANTIGRAVITY_CONTAINER_NAME:?Set ANTIGRAVITY_CONTAINER_NAME in .env}
    build:
      context: .
      dockerfile: Dockerfile.antigravity
    image: local/antigravity-cli
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      HOME: /home/agent
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./workspace:/workspace
      - antigravity_home:/home/agent
    init: true
    restart: unless-stopped

volumes:
  ollama_data:
  codex_home:
  antigravity_home:
